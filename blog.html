---
layout: default
title: Blog Posts
permalink: /blog/
---

<section class="post-filters">
  {% include post_filters.html %}
</section>

<section>
  <ul class="posts-list" data-filterable-posts>
    {% for post in site.posts %}
    {% unless post.tags contains 'draft' or post.tags contains 'secret' %}
    <li data-post-tags="{% for tag in post.tags %}{{ tag | slugify }} {% endfor %}" data-post-year="{{ post.date | date: '%Y' }}">
      {% include post_item.html %}
    </li>
    {% endunless %}

    {% endfor %}
  </ul>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const filter = document.querySelector("[data-post-filter]");
    const postItems = document.querySelectorAll("[data-filterable-posts] > li");

    if (!filter || !postItems.length) return;

    const allTagsButton = filter.querySelector("[data-filter-all-tags]");
    const allYearsButton = filter.querySelector("[data-filter-all-years]");
    const tagButtons = filter.querySelectorAll("[data-filter-tag]");
    const yearButtons = filter.querySelectorAll("[data-filter-year]");
    const selectedTags = new Set();
    const selectedYears = new Set();

    const updatePosts = function () {
      postItems.forEach(function (post) {
        const postTags = post.dataset.postTags.trim().split(/\s+/);
        const matchesTag = selectedTags.size === 0 ||
          Array.from(selectedTags).some(function (tag) {
            return postTags.includes(tag);
          });
        const matchesYear = selectedYears.size === 0 ||
          selectedYears.has(post.dataset.postYear);

        post.hidden = !(matchesTag && matchesYear);
      });

      const showAllTags = selectedTags.size === 0;
      allTagsButton.classList.toggle("is-active", showAllTags);
      allTagsButton.setAttribute("aria-pressed", showAllTags.toString());

      const showAllYears = selectedYears.size === 0;
      allYearsButton.classList.toggle("is-active", showAllYears);
      allYearsButton.setAttribute("aria-pressed", showAllYears.toString());

      tagButtons.forEach(function (button) {
        const isActive = selectedTags.has(button.dataset.filterTag);
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", isActive.toString());
      });

      yearButtons.forEach(function (button) {
        const isActive = selectedYears.has(button.dataset.filterYear);
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", isActive.toString());
      });
    };

    allTagsButton.addEventListener("click", function () {
      selectedTags.clear();
      updatePosts();
    });

    allYearsButton.addEventListener("click", function () {
      selectedYears.clear();
      updatePosts();
    });

    tagButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        const tag = button.dataset.filterTag;

        if (selectedTags.has(tag)) {
          selectedTags.delete(tag);
        } else {
          selectedTags.add(tag);
        }

        updatePosts();
      });
    });

    yearButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        const year = button.dataset.filterYear;

        if (selectedYears.has(year)) {
          selectedYears.delete(year);
        } else {
          selectedYears.add(year);
        }

        updatePosts();
      });
    });
  });
</script>
