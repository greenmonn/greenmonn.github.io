<div class="site-utility-bar">
  <div class="locale-switcher" role="group" aria-label="Language selection">
    <button type="button" data-set-locale="en" aria-label="View in English">EN</button>
    <button type="button" data-set-locale="ko" aria-label="한국어로 보기">KO</button>
  </div>
</div>

<div class="wrap">
  <nav class="navbar" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <a class="navbar-item navbar-title" href="/">
        <img src="{{ '/assets/images/greenmon_pixel.png' | relative_url }}" class="greenmon-image navbar-logo" alt="">
        <span class="greenmon">greenmon</span>.log
      </a>

      <a role="button" class="navbar-burger burger" aria-label="menu" aria-expanded="false" data-target="navbarMenu">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </a>
    </div>

    <div id="navbarMenu" class="navbar-menu">
      <div class="navbar-start">
      </div>
      <div class="navbar-end">
        {% for item in site.data.navigation %}
        <a class="navbar-item" href="{{ item.link }}" {% if page.url==item.link %} style="color: red;" {% endif %}>
          {{ item.name }}
        </a>
        {% endfor %}
      </div>
    </div>
  </nav>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {

    const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);

    if ($navbarBurgers.length > 0) {

      $navbarBurgers.forEach(el => {
        el.addEventListener('click', () => {

          const target = el.dataset.target;
          const $target = document.getElementById(target);

          el.classList.toggle('is-active');
          $target.classList.toggle('is-active');

        });
      });
    }

  });
</script>
